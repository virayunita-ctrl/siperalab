<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Server Light Glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dinding Latar -->
  <rect width="800" height="360" fill="url(#bgGrad)"/>

  <!-- Lantai -->
  <polygon points="0,360 800,360 800,500 0,500" fill="url(#floorGrad)"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#475569" stroke-width="2"/>

  <!-- Grid Pattern di Lantai -->
  <path d="M 100,360 L 0,500 M 250,360 L 200,500 M 400,360 L 400,500 M 550,360 L 600,500 M 700,360 L 800,500" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Papan Tulis / Screen Presentasi Depan -->
  <rect x="250" y="30" width="300" height="130" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <rect x="260" y="40" width="280" height="110" rx="4" fill="url(#screenGlow)" opacity="0.8"/>
  <!-- Teks/Grafik di Papan Tulis -->
  <path d="M 280,120 L 320,90 L 360,105 L 420,65 L 480,95 L 520,70" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="520" cy="70" r="4" fill="#ffffff"/>
  <text x="280" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">COMPUTER LAB NETWORK</text>

  <!-- Rack Server (Pojok Kiri Background) -->
  <rect x="40" y="80" width="100" height="280" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <!-- Slot Server -->
  <g fill="#1e293b" stroke="#0f172a" stroke-width="2">
    <rect x="48" y="95" width="84" height="25" rx="2"/>
    <rect x="48" y="125" width="84" height="25" rx="2"/>
    <rect x="48" y="155" width="84" height="25" rx="2"/>
    <rect x="48" y="185" width="84" height="25" rx="2"/>
    <rect x="48" y="215" width="84" height="25" rx="2"/>
    <rect x="48" y="245" width="84" height="25" rx="2"/>
    <rect x="48" y="275" width="84" height="25" rx="2"/>
    <rect x="48" y="305" width="84" height="25" rx="2"/>
  </g>
  <!-- Lampu Server -->
  <g fill="#22c55e">
    <circle cx="58" cy="107" r="2"/><circle cx="65" cy="107" r="2"/>
    <circle cx="58" cy="137" r="2"/><circle cx="65" cy="137" r="2"/>
    <circle cx="58" cy="167" r="2"/><circle cx="65" cy="167" r="2"/>
    <circle cx="58" cy="197" r="2"/><circle cx="65" cy="197" r="2"/>
    <circle cx="58" cy="227" r="2"/><circle cx="65" cy="227" r="2"/>
    <circle cx="58" cy="257" r="2"/><circle cx="65" cy="257" r="2"/>
    <circle cx="58" cy="287" r="2"/><circle cx="65" cy="287" r="2"/>
    <circle cx="58" cy="317" r="2"/><circle cx="65" cy="317" r="2"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="118" cy="107" r="2"/>
    <circle cx="118" cy="167" r="2"/>
    <circle cx="118" cy="227" r="2"/>
    <circle cx="118" cy="287" r="2"/>
  </g>

  <!-- MEJA KOMPUTER (BARIS TANGGA / PERSPEKTIF) -->

  <!-- Baris 2 (Belakang) -->
  <g id="row-back">
    <!-- Meja -->
    <rect x="180" y="260" width="440" height="15" fill="#475569"/>
    <rect x="180" y="275" width="440" height="40" fill="#1e293b"/>
    
    <!-- Komputer 1 (Kiri) -->
    <rect x="220" y="210" width="60" height="40" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="224" y="214" width="52" height="32" rx="1" fill="#38bdf8" opacity="0.6"/>
    <path d="M 250,250 L 250,260 M 240,260 L 260,260" stroke="#64748b" stroke-width="2"/>

    <!-- Komputer 2 (Tengah) -->
    <rect x="370" y="210" width="60" height="40" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="374" y="214" width="52" height="32" rx="1" fill="#38bdf8" opacity="0.6"/>
    <path d="M 400,250 L 400,260 M 390,260 L 410,260" stroke="#64748b" stroke-width="2"/>

    <!-- Komputer 3 (Kanan) -->
    <rect x="520" y="210" width="60" height="40" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="524" y="214" width="52" height="32" rx="1" fill="#38bdf8" opacity="0.6"/>
    <path d="M 550,250 L 550,260 M 540,260 L 560,260" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Baris 1 (Depan) -->
  <g id="row-front">
    <!-- Meja Utam -->
    <polygon points="100,380 700,380 720,400 80,400" fill="#64748b"/>
    <rect x="80" y="400" width="640" height="60" fill="#334155"/>
    <!-- Kaki Meja -->
    <rect x="100" y="460" width="20" height="40" fill="#1e293b"/>
    <rect x="680" y="460" width="20" height="40" fill="#1e293b"/>

    <!-- Unit Komputer 1 (Kiri) -->
    <!-- Monitor -->
    <rect x="150" y="300" width="100" height="65" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="156" y="306" width="88" height="53" rx="2" fill="url(#screenGlow)"/>
    <path d="M 200,365 L 200,380 M 180,380 L 220,380" stroke="#94a3b8" stroke-width="4"/>
    <!-- Keyboard & Mouse -->
    <rect x="160" y="386" width="60" height="8" rx="2" fill="#1e293b"/>
    <rect x="230" y="387" width="10" height="6" rx="2" fill="#1e293b"/>
    <!-- CPU Tower -->
    <rect x="265" y="310" width="35" height="70" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="282" cy="325" r="4" fill="#38bdf8"/>
    <line x1="272" y1="340" x2="292" y2="340" stroke="#334155" stroke-width="2"/>

    <!-- Unit Komputer 2 (Tengah) -->
    <!-- Monitor -->
    <rect x="350" y="300" width="100" height="65" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="356" y="306" width="88" height="53" rx="2" fill="url(#screenGlow)"/>
    <path d="M 400,365 L 400,380 M 380,380 L 420,380" stroke="#94a3b8" stroke-width="4"/>
    <!-- Keyboard & Mouse -->
    <rect x="360" y="386" width="60" height="8" rx="2" fill="#1e293b"/>
    <rect x="430" y="387" width="10" height="6" rx="2" fill="#1e293b"/>
    <!-- CPU Tower -->
    <rect x="465" y="310" width="35" height="70" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="482" cy="325" r="4" fill="#38bdf8"/>
    <line x1="472" y1="340" x2="492" y2="340" stroke="#334155" stroke-width="2"/>

    <!-- Unit Komputer 3 (Kanan) -->
    <!-- Monitor -->
    <rect x="550" y="300" width="100" height="65" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="556" y="306" width="88" height="53" rx="2" fill="url(#screenGlow)"/>
    <path d="M 600,365 L 600,380 M 580,380 L 620,380" stroke="#94a3b8" stroke-width="4"/>
    <!-- Keyboard & Mouse -->
    <rect x="560" y="386" width="60" height="8" rx="2" fill="#1e293b"/>
    <rect x="630" y="387" width="10" height="6" rx="2" fill="#1e293b"/>
    <!-- CPU Tower -->
    <rect x="665" y="310" width="35" height="70" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="682" cy="325" r="4" fill="#38bdf8"/>
    <line x1="672" y1="340" x2="692" y2="340" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Kursi Laboratorium (Baris Depan) -->
  <g id="chairs">
    <!-- Kursi 1 -->
    <ellipse cx="200" cy="440" rx="25" ry="8" fill="#0f172a"/>
    <path d="M 180,440 C 180,410 220,410 220,440" fill="none" stroke="#0f172a" stroke-width="8"/>
    
    <!-- Kursi 2 -->
    <ellipse cx="400" cy="440" rx="25" ry="8" fill="#0f172a"/>
    <path d="M 380,440 C 380,410 420,410 420,440" fill="none" stroke="#0f172a" stroke-width="8"/>

    <!-- Kursi 3 -->
    <ellipse cx="600" cy="440" rx="25" ry="8" fill="#0f172a"/>
    <path d="M 580,440 C 580,410 620,410 620,440" fill="none" stroke="#0f172a" stroke-width="8"/>
  </g>

  <!-- Elemen Tambahan: Lampu Gantung Atas -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="200" y1="0" x2="200" y2="20"/>
    <line x1="400" y1="0" x2="400" y2="20"/>
    <line x1="600" y1="0" x2="600" y2="20"/>
    <rect x="160" y="20" width="80" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="360" y="20" width="80" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="560" y="20" width="80" height="8" rx="2" fill="#e2e8f0"/>
  </g>
</svg>
