<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Gradien Bodi Multimeter -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradien Panel Depan -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradien Layar LCD -->
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <!-- Bayangan Lembut -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.3"/>
    </filter>

    <!-- Gradien Tombol Dial -->
    <radialGradient id="dialGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Latar Belakang Halus -->
  <rect width="600" height="700" fill="#f8fafc" rx="12"/>

  <!-- Bayangan Utama -->
  <rect x="150" y="50" width="300" height="560" rx="36" fill="#000000" opacity="0.15" filter="url(#shadow)"/>

  <!-- Bodi Luar Multimeter (Casing Pelindung Kuning) -->
  <rect x="150" y="50" width="300" height="560" rx="36" fill="url(#bodyGrad)" stroke="#b45309" stroke-width="4"/>

  <!-- Panel Dalam Hitam -->
  <rect x="168" y="68" width="264" height="524" rx="24" fill="url(#panelGrad)"/>

  <!-- LAYAR LCD -->
  <rect x="190" y="95" width="220" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="198" y="103" width="204" height="74" rx="4" fill="url(#lcdGrad)"/>
  
  <!-- Teks/Angka Digital Layar LCD -->
  <text x="385" y="158" font-family="'Courier New', Courier, monospace" font-size="52" font-weight="bold" fill="#0f172a" text-anchor="end">12.34</text>
  <text x="210" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">DC  AUTO</text>
  <text x="385" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="end">V</text>

  <!-- TOMBOL FUNGSI (HOLD / RANGE) -->
  <rect x="195" y="200" width="60" height="24" rx="5" fill="#3b82f6"/>
  <text x="225" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">HOLD</text>

  <rect x="270" y="200" width="60" height="24" rx="5" fill="#475569"/>
  <text x="300" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RANGE</text>

  <rect x="345" y="200" width="60" height="24" rx="5" fill="#475569"/>
  <text x="375" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SELECT</text>

  <!-- DIAL PEMUTAR SELEKTOR -->
  <circle cx="300" cy="340" r="85" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Skala & Label Dial -->
  <!-- OFF -->
  <text x="300" y="242" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">OFF</text>
  <!-- V~ (AC Voltage) -->
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">V~</text>
  <!-- V= (DC Voltage) -->
  <text x="390" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">V=</text>
  <!-- Ohm / Continuity -->
  <text x="380" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">Ω / •)))</text>
  <!-- Hz -->
  <text x="335" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Hz</text>
  <!-- mA / A -->
  <text x="250" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">mA / A</text>
  <!-- Diode -->
  <text x="205" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">-&#244;-</text>

  <!-- Knob Dial Utama -->
  <circle cx="300" cy="340" r="65" fill="url(#dialGrad)" stroke="#64748b" stroke-width="3"/>
  <circle cx="300" cy="340" r="55" fill="#0f172a"/>
  
  <!-- Penunjuk Dial (Garis indikator menyala) -->
  <path d="M 300,285 L 293,315 L 307,315 Z" fill="#ef4444"/>
  <rect x="297" y="300" width="6" height="30" rx="3" fill="#ef4444"/>

  <!-- PORT TERMINAL (COLOKAN KABEL) -->
  <!-- Port 10A -->
  <circle cx="215" cy="510" r="22" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="215" cy="510" r="14" fill="#ef4444"/>
  <circle cx="215" cy="510" r="8" fill="#000000"/>
  <text x="215" y="548" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">10A MAX</text>

  <!-- Port COM (Ground/Hitam) -->
  <circle cx="300" cy="510" r="22" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="300" cy="510" r="14" fill="#334155"/>
  <circle cx="300" cy="510" r="8" fill="#000000"/>
  <text x="300" y="548" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">COM</text>

  <!-- Port V/Ohm/Hz (Merah) -->
  <circle cx="385" cy="510" r="22" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="385" cy="510" r="14" fill="#ef4444"/>
  <circle cx="385" cy="510" r="8" fill="#000000"/>
  <text x="385" y="548" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">V Ω Hz</text>

  <!-- KABEL & PROBE PENGUKURAN -->
  <!-- Kabel Hitam (COM) -->
  <path d="M 300,510 C 300,640 100,600 80,500" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <!-- Gagang Probe Hitam -->
  <rect x="65" y="380" width="14" height="100" rx="4" fill="#1e293b"/>
  <rect x="68" y="370" width="8" height="10" fill="#475569"/>
  <!-- Jarum Probe Hitam -->
  <polygon points="71,320 73,320 74,370 70,370" fill="#cbd5e1"/>

  <!-- Kabel Merah (V/Ohm) -->
  <path d="M 385,510 C 385,670 520,600 520,500" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <!-- Gagang Probe Merah -->
  <rect x="525" y="380" width="14" height="100" rx="4" fill="#dc2626"/>
  <rect x="528" y="370" width="8" height="10" fill="#991b1b"/>
  <!-- Jarum Probe Merah -->
  <polygon points="531,320 533,320 534,370 530,370" fill="#cbd5e1"/>

  <!-- Merek / Model -->
  <text x="300" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="2" text-anchor="middle">DIGITAL MULTIMETER</text>
</svg>
