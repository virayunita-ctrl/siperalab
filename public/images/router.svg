<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradien Bodi Router -->
    <linearGradient id="routerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradien Antena -->
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Pancaran Sinyal Wi-Fi -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Bayangan -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Latar Belakang -->
  <rect width="600" height="500" fill="#f8fafc" rx="16"/>

  <!-- Bayangan Router -->
  <ellipse cx="300" cy="410" rx="210" ry="18" fill="#000000" opacity="0.2" filter="url(#shadow)"/>

  <!-- GELOMBANG / SINYAL WI-FI -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Busur Sinyal 1 (Bawah) -->
    <path d="M 260,130 A 50,50 0 0,1 340,130"/>
    <!-- Busur Sinyal 2 (Tengah) -->
    <path d="M 235,100 A 85,85 0 0,1 365,100"/>
    <!-- Busur Sinyal 3 (Atas) -->
    <path d="M 210,70 A 120,120 0 0,1 390,70"/>
  </g>

  <!-- ANTENA ROUTER -->
  <!-- Antena 1 (Kiri Luar - Agak Miring) -->
  <g transform="rotate(-12 140 300)">
    <rect x="135" y="150" width="12" height="160" rx="4" fill="url(#antennaGrad)"/>
    <circle cx="141" cy="305" r="10" fill="#0f172a"/>
  </g>

  <!-- Antena 2 (Kiri Dalam) -->
  <rect x="220" y="140" width="12" height="170" rx="4" fill="url(#antennaGrad)"/>
  <circle cx="226" cy="305" r="10" fill="#0f172a"/>

  <!-- Antena 3 (Kanan Dalam) -->
  <rect x="368" y="140" width="12" height="170" rx="4" fill="url(#antennaGrad)"/>
  <circle cx="374" cy="305" r="10" fill="#0f172a"/>

  <!-- Antena 4 (Kanan Luar - Agak Miring) -->
  <g transform="rotate(12 460 300)">
    <rect x="453" y="150" width="12" height="160" rx="4" fill="url(#antennaGrad)"/>
    <circle cx="459" cy="305" r="10" fill="#0f172a"/>
  </g>

  <!-- BODI ROUTER UTAMA -->
  <!-- Panel Bawah/Samping -->
  <path d="M 100,350 L 130,390 L 470,390 L 500,350 Z" fill="#020617"/>
  
  <!-- Bodi Utama -->
  <rect x="90" y="300" width="420" height="60" rx="12" fill="url(#routerBody)" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>

  <!-- Aksen Ventilasi Utam / Tekstur Garis Modern -->
  <path d="M 120,312 L 480,312 M 120,320 L 480,320" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- PANEL INDIKATOR LAMPU LED -->
  <rect x="180" y="338" width="240" height="12" rx="6" fill="#090d16"/>

  <!-- Lampu LED (Menyala Hijau & Biru) -->
  <!-- Power -->
  <circle cx="210" cy="344" r="3" fill="#22c55e"/>
  <!-- Internet / WAN -->
  <circle cx="240" cy="344" r="3" fill="#38bdf8"/>
  <!-- Wi-Fi 2.4GHz -->
  <circle cx="270" cy="344" r="3" fill="#38bdf8"/>
  <!-- Wi-Fi 5GHz -->
  <circle cx="300" cy="344" r="3" fill="#38bdf8"/>
  <!-- LAN 1 -->
  <circle cx="330" cy="344" r="3" fill="#22c55e"/>
  <!-- LAN 2 -->
  <circle cx="360" cy="344" r="3" fill="#22c55e"/>
  <!-- WPS -->
  <circle cx="390" cy="344" r="3" fill="#475569"/>

  <!-- Logo Brand / Seri -->
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="3">WI-FI 6 ROUTER</text>
</svg>
